[project]
name = "crypto-arb-engine"
version = "0.1.0"
description = "Quantitative crypto arbitrage & delta-neutral funding-rate engine. Paper trading first, Decimal-only math, zero-cost stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "duckdb>=1.1.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
]
front = [
    "streamlit>=1.40",
    "pandas>=2.2",
]

[project.scripts]
crypto-arb = "app.main:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
